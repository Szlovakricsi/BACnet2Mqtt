configuration:
  mqtt_host:
    name: MQTT broker
    description: MQTT broker hostname or IP address.
  mqtt_port:
    name: MQTT port
    description: MQTT broker port.
  mqtt_username:
    name: MQTT username
    description: Leave empty if authentication is not required.
  mqtt_password:
    name: MQTT password
    description: Leave empty if authentication is not required.
  bacnet_interface:
    name: BACnet local interface
    description: Local IPv4 address on the BACnet network.
  bacnet_broadcast:
    name: BACnet broadcast address
    description: BACnet/IP subnet broadcast address.
  bacnet_port:
    name: BACnet UDP port
    description: Default BACnet/IP port is 47808.
  apdu_timeout:
    name: BACnet APDU timeout
    description: BACnet response timeout in milliseconds.
  write_priority:
    name: BACnet write priority
    description: WriteProperty priority from 1 to 16.
  scan_timeout:
    name: Scan time
    description: Number of seconds to collect I-Am responses.
  health_interval:
    name: Health interval
    description: Device online/offline check interval in seconds.
  poll_interval:
    name: Full poll interval
    description: Full fallback polling interval in seconds.
  read_concurrency:
    name: Read concurrency
    description: Maximum parallel point reads per device.
  cov_enabled:
    name: Enable COV
    description: Enable BACnet Change of Value subscriptions.
  cov_lifetime:
    name: COV lifetime
    description: Subscription lifetime in seconds.
  cov_renew_percent:
    name: COV renew percentage
    description: Renew subscriptions at this percentage of lifetime.
  cov_subscribe_delay_ms:
    name: COV subscribe delay
    description: Delay between COV subscription requests in milliseconds.
  log_level:
    name: Log level
    description: error, warn, info or debug.
